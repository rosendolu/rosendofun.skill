interface:
  display_name: "三面三思六位交易战法"
  short_description: "三面三思六维交易研究与风险决策"
  brand_color: "#C2410C"
  default_prompt: "Use $three-sides-three-thoughts-trading to analyze BTC with the Three Sides and Three Thoughts framework."

dependencies:
  tools:
    - type: "mcp"
      value: "coingecko"
      description: "CoinGecko market, token and onchain data"
      transport: "stdio"
    - type: "mcp"
      value: "binance"
      description: "Binance market and derivatives data"
      transport: "streamable_http"
      url: "https://agent.binance.com/mcp/agentic"
    - type: "mcp"
      value: "okx"
      description: "OKX read-only market data"
      transport: "stdio"
    - type: "mcp"
      value: "bybit"
      description: "Bybit market and derivatives data"
      transport: "stdio"
    - type: "mcp"
      value: "coinmarketcap"
      description: "CoinMarketCap market, news and sentiment data"
      transport: "streamable_http"
      url: "https://mcp.coinmarketcap.com/mcp"
    - type: "mcp"
      value: "defillama"
      description: "DefiLlama TVL, protocol, flow and unlock data"
      transport: "streamable_http"
      url: "https://mcp.defillama.com/mcp"
    - type: "mcp"
      value: "glassnode"
      description: "Glassnode on-chain metrics and market intelligence"
      transport: "streamable_http"
      url: "https://mcp.glassnode.com"
    - type: "mcp"
      value: "etherscan"
      description: "Etherscan on-chain transactions, contracts and address flows"
      transport: "streamable_http"
      url: "https://mcp.etherscan.io/mcp"
    - type: "mcp"
      value: "gate-info"
      description: "Gate public read-only market, coin, on-chain and macro research"
      transport: "streamable_http"
      url: "https://api.gatemcp.ai/mcp/info"
    - type: "mcp"
      value: "gate-news"
      description: "Gate public read-only news, events, social sentiment and announcements"
      transport: "streamable_http"
      url: "https://api.gatemcp.ai/mcp/news"

policy:
  allow_implicit_invocation: true

